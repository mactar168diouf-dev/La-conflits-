<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>JACK MACTAR DIOUF - COD SENEGAL</title><style>*{margin:0;padding:0;box-sizing:border-box;touch-action:none;user-select:none}body{background:#000;color:#fff;font-family:monospace;overflow:hidden;height:100vh;display:flex;flex-direction:column}#game{flex:1;position:relative;background:radial-gradient(ellipse at center,#1a2f1a 0%,#0a1a0a 60%,#000 100%);overflow:hidden}.top-bar{position:absolute;top:0;left:0;right:0;height:36px;background:linear-gradient(90deg,#00853F 33%,#FDEF42 33%,#FDEF42 66%,#E31E24 66%);display:flex;align-items:center;justify-content:space-between;padding:0 10px;z-index:10}.top-in{background:#000;padding:4px 10px;border-radius:6px;display:flex;gap:12px;font-size:10px}.hud-helico{position:absolute;top:45px;left:5px;right:5px;display:flex;justify-content:space-between;z-index:5}.helico-modern{background:rgba(0,0,0,0.85);border:2px solid #FDEF42;border-radius:8px;padding:5px 8px;font-size:9px;text-align:center;min-width:110px}.battlefield{position:absolute;top:110px;left:50%;transform:translateX(-50%);width:92%;height:42%;background:linear-gradient(#1e3a1e,#0f2a0f);border:2px solid #333;border-radius:10px;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:4px;padding:8px}.soldier{width:28px;height:28px;background:#222;border:1px solid #0f0;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:12px}.soldier.jack{background:#FDEF42;color:#000;border-color:#E31E24;width:34px;height:34px;font-weight:bold;box-shadow:0 0 10px #FDEF42}.controls{position:absolute;bottom:0;left:0;right:0;height:38%;pointer-events:none}.left-pad{position:absolute;left:8px;bottom:20px;width:130px;height:130px;pointer-events:auto}.dpad{position:absolute;width:48px;height:48px;background:rgba(255,255,255,0.15);border:2px solid rgba(255,255,255,0.4);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;color:#fff}.dpad:active{background:rgba(253,239,66,0.6)}#up{left:41px;top:0}#down{left:41px;bottom:0}#left{left:0;top:41px}#right{right:0;top:41px}.center-btn{position:absolute;left:41px;top:41px;width:48px;height:48px;background:rgba(0,133,63,0.5);border:2px solid #00ff88;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px}.right-pad{position:absolute;right:8px;bottom:15px;width:160px;height:180px;pointer-events:auto}.action-btn{position:absolute;background:rgba(0,0,0,0.6);border:2px solid #fff;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;font-size:9px;font-weight:bold}.action-btn:active{transform:scale(0.9);background:rgba(253,239,66,0.7)}#fire{right:10px;top:10px;width:72px;height:72px;border-color:#E31E24;background:rgba(227,30,36,0.4);font-size:14px}#aim{right:90px;top:15px;width:52px;height:52px;border-color:#00ff88}#peekL{right:95px;bottom:65px;width:46px;height:46px;border-color:#FDEF42;color:#FDEF42}#peekR{right:25px;bottom:65px;width:46px;height:46px;border-color:#FDEF42;color:#FDEF42}#reload{right:100px;bottom:10px;width:44px;height:44px}#crouch{right:30px;bottom:10px;width:44px;height:44px}#switchW{left:0;top:20px;width:42px;height:42px;font-size:8px}.crosshair{position:absolute;left:50%;top:48%;transform:translate(-50%,-50%);width:30px;height:30px;pointer-events:none;z-index:6}.crosshair::before,.crosshair::after{content:'';position:absolute;background:#00ff88}.crosshair::before{width:2px;height:30px;left:14px;top:0}.crosshair::after{width:30px;height:2px;left:0;top:14px}.mission-bar{position:absolute;bottom:2px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.8);border:1px solid #FDEF42;border-radius:20px;padding:4px 14px;font-size:10px;z-index:7;white-space:nowrap}</style></head><body><div id="game"><div class="top-bar"><div class="top-in"><span>🇸🇳 JACK MACTAR DIOUF</span><span id="missionTxt" style="color:#FDEF42">MISSION 1/40</span><span id="ammo" style="color:#00ff88">16/16</span></div><div class="top-in"><span id="grade">SOLDAT</span></div></div><div class="hud-helico"><div class="helico-modern">🚁 AH-64E APACHE<br><span style="color:#FDEF42">DERNIERE GEN - 8 HOMMES</span><br><span style="color:#00ff88">● EN VOL</span></div><div class="helico-modern">🚁 AH-64E APACHE<br><span style="color:#FDEF42">DERNIERE GEN - 8 HOMMES</span><br><span style="color:#00ff88">● EN VOL</span></div></div><div class="battlefield" id="field"><div style="width:100%;text-align:center;color:#FDEF42;font-size:11px">📍 BIGNONA - ZONE HOSTILE</div></div><div class="crosshair" id="cross"></div><div class="controls"><div class="left-pad"><div class="dpad" id="up">▲</div><div class="dpad" id="down">▼</div><div class="dpad" id="left">◀</div><div class="dpad" id="right">▶</div><div class="center-btn">JACK</div></div><div class="right-pad"><div class="action-btn" id="fire" onclick="fire()">🔥<br>TIR</div><div class="action-btn" id="aim" onclick="aim()">🎯<br>VISER</div><div class="action-btn" id="peekL" onclick="peek('L')">👁️◀<br>COUP D'OEIL</div><div class="action-btn" id="peekR" onclick="peek('R')">▶👁️<br>COUP D'OEIL</div><div class="action-btn" id="reload" onclick="reload()">🔄<br>RECHARGE</div><div class="action-btn" id="crouch" onclick="crouch()">🧎<br>ACCROUPI</div><div class="action-btn" id="switchW" onclick="alert('M4A1 + RPG')">🔫<br>ARME</div></div></div><div class="mission-bar" id="logBar">🚁 DEPOSE 16 HOMMES - APPUIE TIR</div></div><script>let missions=Array(40).fill(0),cur=0,ammo=16,aiming=false,peeking=null;const zones=["BIGNONA 1","BAGANDA","BIGNONA 2","DIANAH","ZIG 1","ZIG 2","OUSSOUYE","KOLDA 1","KOLDA 2","SEDHIOU 1","SEDHIOU 2","BIGNONA 3","FORET 1","FORET 2","VILLAGE 1","VILLAGE 2","FRONT 1","FRONT 2","BASE 1","BASE 2","BIGNONA 4","ZIG 3","KOLDA 3","CAP SKIRRING","ELINKINE","DIOULOULOU","TENDOUCK","MARSASSOUM","ADEANE","NIAGUIS","NYASSIA","BOUTOUPA","ENAMPORE","KATABA","KAFOUNTINE","ABENE","DIOEMBERING","CARABANE","BIGNONA QG"];function spawn(){let f=document.getElementById('field');f.innerHTML='<div style="width:100%;text-align:center;color:#FDEF42;font-size:11px">📍 '+zones[cur]+' - '+(missions[cur]?'LIBÉRÉE':'HOSTILE')+'</div>';for(let i=0;i<16;i++){let d=document.createElement('div');d.className=i===0?'soldier jack':'soldier';d.textContent=i===0?'J':'●';f.appendChild(d)}let eng=document.createElement('div');eng.style.cssText='width:100%;display:flex;justify-content:space-around;margin-top:4px;font-size:9px';eng.innerHTML='<div style="background:rgba(0,0,0,0.85);border:1px solid #00853F;border-radius:6px;padding:3px 6px">🚛 M2 BRADLEY 30mm</div><div style="background:rgba(0,0,0,0.85);border:1px solid #00853F;border-radius:6px;padding:3px 6px">🚛 VBCI 2 25mm</div>';f.appendChild(eng);document.getElementById('missionTxt').textContent='MISSION '+(cur+1)+'/40';document.getElementById('ammo').textContent=ammo+'/16'}function fire(){if(ammo<=0)return;ammo--;document.getElementById('ammo').textContent=ammo+'/16';let f=document.getElementById('field');f.style.background='linear-gradient(#3a1a1a,#2a0f0f)';setTimeout(()=>f.style.background='linear-gradient(#1e3a1e,#0f2a0f)',100);let s=document.querySelectorAll('.soldier:not(.jack)');if(s.length){let t=s[Math.floor(Math.random()*s.length)];t.textContent='✕';t.style.background='#E31E24';setTimeout(()=>{t.style.display='none';check()},200)}document.getElementById('logBar').textContent='🔥 TIR! '+ammo+'/16 - Ennemi touché!'}function check(){let a=document.querySelectorAll('.soldier:not(.jack):not([style*="display: none"])').length;if(a===0&&!missions[cur]){missions[cur]=1;document.getElementById('logBar').textContent='✅ ZONE '+zones[cur]+' LIBÉRÉE!';setTimeout(()=>{if(cur<39){cur++;ammo=16;spawn();document.getElementById('logBar').textContent='🚁 MISSION '+(cur+1)+' - '+zones[cur]+' - DEPOSE 16 HOMMES'}else{document.getElementById('logBar').textContent='🇸🇳 VICTOIRE 40/40 - CASAMANCE LIBÉRÉE!'}},1200)}}function aim(){aiming=!aiming;document.getElementById('cross').style.transform='translate(-50%,-50%) scale('+(aiming?1.8:1)+')';document.getElementById('logBar').textContent=aiming?'🎯 VISÉE x2 ACTIVÉE':'🎯 VISÉE NORMALE'}function peek(d){document.getElementById('field').style.transform=d==='L'?'translateX(-40%)':'translateX(-60%)';document.getElementById('logBar').textContent=d==='L'?'👁️◀ COUP D\'OEIL GAUCHE':'▶👁️ COUP D\'OEIL DROIT';setTimeout(()=>{document.getElementById('field').style.transform='translateX(-50%)'},1200)}function reload(){ammo=16;document.getElementById('ammo').textContent='16/16';document.getElementById('logBar').textContent='🔄 RECHARGÉ 16/16 - AH-64E couvrent!'}function crouch(){document.getElementById('field').style.height=document.getElementById('field').style.height==='32%'?'42%':'32%';document.getElementById('logBar').textContent='🧎 ACCROUPI / DEBOUT'}spawn();</script></body></html>
