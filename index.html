
<!DOCTYPE html>
<html><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<style>body{margin:0;overflow:hidden;background:#1a2e0a}canvas{width:100vw;height:100vh;display:block}#hud{position:absolute;top:0;left:0;right:0;background:#000d;color:#0f0;display:flex;justify-content:space-between;padding:8px;font:12px monospace}#joy{position:absolute;bottom:20px;left:20px;width:110px;height:110px;border-radius:50%;background:#fff2;border:2px solid #fff5}#stick{position:absolute;left:30px;top:30px;width:50px;height:50px;border-radius:50%;background:#0f0a;border:2px solid #0f0}#fire{position:absolute;bottom:30px;right:20px;width:80px;height:80px;border-radius:50%;background:red;color:#fff;border:none;font-weight:bold}</style>
</head><body>
<div id="hud"><span>SEN: <b id="s">20</b></span><span>BIGNONA 2034</span><span>REB: <b id="r">25</b></span></div>
<canvas id="c"></canvas>
<div id="joy"><div id="stick"></div></div><button id="fire">TIR</button>
<script>
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
let W=canvas.width=window.innerWidth*2, H=canvas.height=window.innerHeight*2;
window.onresize=()=>{W=canvas.width=innerWidth*2; H=canvas.height=innerHeight*2}
let houses=[{x:W*0.2,y:H*0.25,w:140,h:100},{x:W*0.6,y:H*0.2,w:160,h:110},{x:W*0.3,y:H*0.55,w:170,h:120},{x:W*0.65,y:H*0.65,w:140,h:100}];
let soldiers=[],enemies=[];
for(let i=0;i<20;i++) soldiers.push({x:100+Math.random()*200,y:200+Math.random()*300,tx:W*0.3,ty:H*0.4,vx:0,vy:0,hp:100,a:0,team:'S'})
for(let i=0;i<25;i++) enemies.push({x:W*0.6+Math.random()*300,y:200+Math.random()*400,tx:W*0.6,ty:H*0.5,vx:0,vy:0,hp:100,a:0,team:'R'})
let chef=soldiers[0], joy=document.getElementById('joy'), stick=document.getElementById('stick'), jv={x:0,y:0}, ja=false;
joy.addEventListener('touchstart',()=>ja=true); joy.addEventListener('touchend',()=>{ja=false;jv={x:0,y:0};stick.style.left='30px';stick.style.top='30px'});
joy.addEventListener('touchmove',e=>{let r=joy.getBoundingClientRect(),t=e.touches[0],dx=t.clientX-r.left-55,dy=t.clientY-r.top-55,d=Math.hypot(dx,dy),m=35;if(d>m){dx=dx/d*m;dy=dy/d*m}stick.style.left=30+dx+'px';stick.style.top=30+dy+'px';jv={x:dx/m,y:dy/m}});
document.getElementById('fire').ontouchstart=()=>{enemies.forEach(en=>{if(Math.hypot(en.x-chef.x,en.y-chef.y)<350)en.hp-=30})}
function drawHouse(h){ctx.fillStyle='#e8d5b5';ctx.fillRect(h.x,h.y,h.w,h.h);ctx.fillStyle='#8b4513';ctx.beginPath();ctx.moveTo(h.x-10,h.y);ctx.lineTo(h.x+h.w/2,h.y-50);ctx.lineTo(h.x+h.w+10,h.y);ctx.fill()}
function drawHuman(p,e){ctx.save();ctx.translate(p.x,p.y);let leg=Math.sin(p.a)*9;ctx.fillStyle='#0003';ctx.beginPath();ctx.ellipse(0,20,12,4,0,0,6.28);ctx.fill();ctx.strokeStyle=e?'#4b2e0f':'#1a5c2a';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(-4,8);ctx.lineTo(-4+leg,19);ctx.stroke();ctx.beginPath();ctx.moveTo(4,8);ctx.lineTo(4-leg,19);ctx.stroke();ctx.fillStyle=e?'#8b4513':'#2ecc71';ctx.fillRect(-7,0,14,12);ctx.fillStyle=e?'#000':'#0a3d0a';ctx.beginPath();ctx.arc(0,-7,9,0,6.28);ctx.fill();ctx.fillStyle='#c68642';ctx.beginPath();ctx.arc(0,-6,4,0,6.28);ctx.fill();ctx.fillStyle='#222';ctx.fillRect(6,-2,16,3);ctx.restore()}
function loop(){
ctx.fillStyle='#a8c686';ctx.fillRect(0,0,W,H);
houses.forEach(drawHouse);
if(ja){chef.tx+=jv.x*15; chef.ty+=jv.y*15}
soldiers.forEach((s,i)=>{if(s!==chef){s.tx=chef.tx+Math.cos(i)*40; s.ty=chef.ty+Math.sin(i)*40} s.vx+=(s.tx-s.x)*0.03; s.vy+=(s.ty-s.y)*0.03; s.vx*=0.88; s.vy*=0.88; s.x+=s.vx; s.y+=s.vy; s.a+=Math.hypot(s.vx,s.vy)*0.15});
enemies.forEach(en=>{let ns=soldiers.filter(ss=>Math.hypot(en.x-ss.x,en.y-ss.y)<200).length; if(ns>3){en.tx+=en.x-chef.x; en.ty+=en.y-chef.y}else{let t=soldiers[Math.floor(Math.random()*soldiers.length)];en.tx=t.x; en.ty=t.y} en.vx+=(en.tx-en.x)*0.02; en.vy+=(en.ty-en.y)*0.02; en.vx*=0.9; en.vy*=0.9; en.x+=en.vx; en.y+=en.vy; en.a+=Math.hypot(en.vx,en.vy)*0.15});
enemies=enemies.filter(e=>e.hp>0); soldiers=soldiers.filter(e=>e.hp>0);
[...soldiers,...enemies].sort((a,b)=>a.y-b.y).forEach(p=>drawHuman(p,p.team==='R'));
document.getElementById('s').innerText=soldiers.length; document.getElementById('r').innerText=enemies.length;
requestAnimationFrame(loop)} loop();
</script></body></html>
